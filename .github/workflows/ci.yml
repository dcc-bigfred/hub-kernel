# Fast checks on every PR; full kernel build on main (release tags reuse this artifact).

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanity
        run: make check

  build:
    name: kernel package
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: sudo bash scripts/install-deps.sh

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('VERSIONS', 'configs/**', 'patches/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build and pack
        run: |
          export VERSION="g$(git rev-parse --short HEAD)"
          make package

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: bigfred-kernel-rpi5
          path: |
            dist/bigfred-kernel-rpi5-*.tar.xz
            dist/bigfred-kernel-rpi5-*.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14
