# Tag v* → GitHub Release from the CI artifact built on main (no rebuild).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v6.18.0-r1)
        required: true
      commit:
        description: Commit with a successful main CI artifact (default = tag target / HEAD)
        required: false

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve successful main CI run for this commit
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="${COMMIT}"
          run_id="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow=ci.yml \
            --branch=main \
            --commit="${commit}" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
            echo "error: no successful CI run on main for commit ${commit}" >&2
            echo "Push to main and wait for CI before tagging." >&2
            exit 1
          fi
          echo "Using CI run ${run_id} (commit ${commit})"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download kernel artifact from CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${{ steps.ci_run.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            -n bigfred-kernel-rpi5 \
            -D dist
          ls -la dist/

      - name: Relabel tarball for release tag
        run: |
          set -euo pipefail
          src="$(ls dist/bigfred-kernel-rpi5-*.tar.xz | head -1)"
          rm -f "dist/bigfred-kernel-rpi5-${TAG}.tar.xz" "dist/bigfred-kernel-rpi5-${TAG}.tar.xz.sha256"
          bash scripts/relabel-release.sh "${src}" "${TAG}" dist
          rm -f "${src}" "${src}.sha256" 2>/dev/null || true

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar="dist/bigfred-kernel-rpi5-${TAG}.tar.xz"
          sum="${tar}.sha256"
          test -f "${tar}"
          test -f "${sum}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              "${tar}" "${sum}"
          else
            echo "Release ${TAG} exists; uploading assets"
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              "${tar}" "${sum}" --clobber
          fi
